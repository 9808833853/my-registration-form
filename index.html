<!DOCTYPE html>
<html>
<head>
    <title>My First Form</title>

    <style>

        body {
            font-family: Arial;
        }

        input {
            width: 300px;
            height: 35px;
            padding: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .namebox {
            background-color: lightblue;
        }

        .submitbtn {
            width: 120px;
            height: 40px;
            background-color: green;
            color: white;
            border-radius: 8px;
            border: none;
        }

        #message {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        .formbox {
            width: 500px;
            padding: 25px;
            border: 1px solid gray;
            border-radius: 10px;
            margin: 50px auto;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        table {
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
        }

    </style>
</head>

<body>

    <div class="product-card">

    <img
        src="WhatsApp Image 2026-08-14 at 20.34.00.jpeg"
        alt="Necklace"
        width="250"
    >

    <h2>Necklace</h2>

    <h3>₹199</h3>

    <button type="button" onclick="buyNow()">
        Buy Now
    </button>

</div>

    <h2>Registration Form</h2>

    <form class="formbox">
        
        <img src="WhatsApp Image 2026-08-14 at 16.54.36.jpeg" alt="My Photo" width="150">

        <label>Name:</label>
        <input class="namebox" id="name" type="text">

        <br><br>

        <label>Mobile:</label>
        <input
            id="mobile"
            type="text"
            maxlength="10"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')"
        >

        <br><br>

        <label>Email:</label>
        <input id="email" type="email">

        <br><br>

        <label>Password:</label>
        <input id="password" type="password">

        <button type="button" onclick="showPassword(this)">Show</button>

        <br><br>

        <input
            class="submitbtn"
            type="submit"
            value="Submit"
            onclick="submitForm(event)"
        >
        
        <br>

        <input
            type="text"
            id="search"
            placeholder="Search Name..."
            oninput="searchName()"
        >

        <br>

        <button type="button" onclick="clearSearch()">Clear Search</button>

        <br><br>

        <p id="message"></p>

        <br>

        <button type="button" onclick="clearForm()">Clear Form</button>

        <br><br>

        <table border="1" id="dataTable">

            <tr>
                <th>Name</th>
                <th>Mobile</th>
                <th>Email</th>
                <th>Action</th>
            </tr>

        </table>

    </form>


    <script>

        let editingRow = null;


        function showPassword(button) {

            let password = document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";
                button.innerText = "Hide";

            } else {

                password.type = "password";
                button.innerText = "Show";

            }

        }


        function submitForm(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let mobile = document.getElementById("mobile").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;


            if (name == "") {

                alert("Please enter your name");

            }

            else if (mobile == "") {

                alert("Please enter your mobile number");

            }

            else if (mobile.length != 10) {

                alert("Mobile number must be 10 digits");

            }

            else if (email == "") {

                alert("Please enter your email");

            }

            else if (!email.includes("@") || !email.includes(".")) {

                alert("Please enter a valid email");

            }

            else if (password == "") {

                alert("Please enter your password");

            }

            else if (password.length < 6) {

                alert("Password must be at least 6 characters");

            }

            else {

                document.getElementById("message").innerText =
                    "Registration Successful!";


                if (editingRow != null) {

                    editingRow.cells[0].innerText = name;
                    editingRow.cells[1].innerText = mobile;
                    editingRow.cells[2].innerText = email;

                    editingRow = null;

                }

                else {

                    let table = document.getElementById("dataTable");

                    let row = table.insertRow();

                    row.insertCell(0).innerText = name;
                    row.insertCell(1).innerText = mobile;
                    row.insertCell(2).innerText = email;

                    let actionCell = row.insertCell(3);

                    actionCell.innerHTML =
                        '<button type="button" onclick="editRow(this)">Edit</button> ' +
                        '<button type="button" onclick="deleteRow(this)">Delete</button>';

                }

            }

        }


        function deleteRow(button) {

            let row = button.parentElement.parentElement;

            row.remove();

        }


        function editRow(button) {

            let row = button.parentElement.parentElement;

            editingRow = row;

            document.getElementById("name").value =
                row.cells[0].innerText;

            document.getElementById("mobile").value =
                row.cells[1].innerText;

            document.getElementById("email").value =
                row.cells[2].innerText;

        }

            function clearForm() {

                document.getElementById("name").value = "";
                document.getElementById("mobile").value = "";
                document.getElementById("email").value = "";
                document.getElementById("password").value = "";
                document.getElementById("message").innerText = "";
                editingRow = null;
       }
          
           function searchName() {

               let searchValue = document.getElementById("search").value.toLowerCase();

               let table = document.getElementById("dataTable");

               let rows = table.getElementsByTagName("tr");

               for (let i = 1; i < rows.length; i++) {

                    let name = rows[i].cells[0].innerText.toLowerCase();

                    if (name.includes(searchValue)) {

                        rows[i].style.display = "";

                    } else {

                        rows[i].style.display = "none";

                    }

               }

           }

          function clearSearch() {

              document.getElementById("search").value = "";

              searchName();

          }

         function buyNow() {

             document.getElementById("name").scrollIntoView();

             document.getElementById("name").focus();

         }

    </script>

</body>
</html>
